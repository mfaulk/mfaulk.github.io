<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16.0 -702.0 1330.4 728.0" width="1330.4" height="728.0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, sans-serif" role="img" aria-label="The transformer architecture at three zoom levels. On the left, scaled dot-product attention: queries and keys meet in a matrix multiply, which is scaled, passed through a softmax, and multiplied by the values. In the middle, multi-head attention: keys, values and queries are each projected by a linear layer and fed to h parallel scaled dot-product attention heads, whose outputs are concatenated and projected again. On the right, the full encoder-decoder stack: an encoder of N blocks, each a multi-head self-attention sublayer and a feed-forward sublayer with Add and Norm after each, and a decoder of N blocks that adds a masked self-attention sublayer and a cross-attention sublayer taking its keys and values from the encoder output, ending in a linear projection and a softmax.">
