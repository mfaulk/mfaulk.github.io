<text x="376.0" y="-97.5" text-anchor="middle" font-size="14" fill="#1a2a3a">Self-Attention</text>
<line x1="376.0" y1="-74.0" x2="376.0" y2="-88.0" stroke="#55606b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 376.0 -134.0 V -160.0 H 279.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="331.0" y="-169.0" text-anchor="middle" font-size="12" fill="#55606b" opacity="0.9">dropout</text>
<circle cx="266.0" cy="-160.0" r="10" fill="none" stroke="#55606b" stroke-width="1.5"/>
<path d="M 261.0 -160.0 h 10 M 266.0 -165.0 v 10" stroke="#55606b" stroke-width="1.5"/>
<rect x="301.0" y="-244.0" width="150.0" height="30.0" rx="6" fill="#EFF1F3" stroke="#55606b" stroke-width="1.5"/>
<text x="376.0" y="-224.0" text-anchor="middle" font-size="12" fill="#1a2a3a">LayerNorm</text>
<path d="M 266.0 -188.0 H 376.0 V -214.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="301.0" y="-288.0" width="150.0" height="30.0" rx="6" fill="#EAF3EE" stroke="#2F7A4F" stroke-width="1.5"/>
<text x="376.0" y="-268.0" text-anchor="middle" font-size="14" fill="#1a2a3a">Feed Forward</text>
<line x1="376.0" y1="-244.0" x2="376.0" y2="-258.0" stroke="#55606b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 376.0 -288.0 V -314.0 H 279.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="331.0" y="-323.0" text-anchor="middle" font-size="12" fill="#55606b" opacity="0.9">dropout</text>
<circle cx="266.0" cy="-314.0" r="10" fill="none" stroke="#55606b" stroke-width="1.5"/>
<path d="M 261.0 -314.0 h 10 M 266.0 -319.0 v 10" stroke="#55606b" stroke-width="1.5"/>
<line x1="266.0" y1="0.0" x2="266.0" y2="-354.0" stroke="#55606b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="206.0" y="-388.0" width="120.0" height="30" rx="6" fill="#EFF1F3" stroke="#55606b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="266.0" y="-368.0" text-anchor="middle" font-size="12" fill="currentColor">LayerNorm</text>
<text x="336.0" y="-369.0" text-anchor="start" font-size="12" fill="#55606b" opacity="0.9">once, after the N× stack</text>
<line x1="266.0" y1="-388.0" x2="266.0" y2="-408.0" stroke="#55606b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="266.0" y="-422.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.85">to the next block</text>
<text x="250.0" y="-64.0" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7" transform="rotate(-90 250.0 -64.0)">residual path</text>
<text x="-6.0" y="-466.0" text-anchor="middle" font-size="14" fill="currentColor" font-weight="600">post-norm</text>
<text x="-6.0" y="-446.0" text-anchor="middle" font-size="12" fill="#55606b">x ← LayerNorm(x + Sublayer(x))</text>
<text x="330.0" y="-466.0" text-anchor="middle" font-size="14" fill="currentColor" font-weight="600">pre-norm</text>
<text x="330.0" y="-446.0" text-anchor="middle" font-size="12" fill="#55606b">x ← x + Sublayer(LayerNorm(x))</text>
</svg>
