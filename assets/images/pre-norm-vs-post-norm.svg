<svg xmlns="http://www.w3.org/2000/svg" viewBox="-146.0 -496.0 659.3 550.0" width="659.3" height="550.0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, sans-serif" role="img" aria-label="Two encoder blocks side by side. In the post-norm block on the left, each sublayer's output is added back to the residual path and the sum is then passed through a LayerNorm, so the path is interrupted by a normalization between every pair of sublayers. In the pre-norm block on the right, the LayerNorm moves onto the branch ahead of each sublayer and the residual path runs unbroken from the block's input to its output, with a single LayerNorm after the whole stack. Dropout is applied to each sublayer's output before the addition in both arrangements, never to the residual path itself.">
<title>Pre-norm and post-norm transformer blocks</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#55606b"/></marker></defs>
<text x="-70.0" y="34.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.85">x — from the previous block</text>
<rect x="-35.0" y="-90.0" width="150.0" height="46.0" rx="6" fill="#ECF3FA" stroke="#1F5CA8" stroke-width="1.5"/>
<text x="40.0" y="-70.0" text-anchor="middle" font-size="14" fill="#1a2a3a">Multi-Head</text>
<text x="40.0" y="-53.5" text-anchor="middle" font-size="14" fill="#1a2a3a">Self-Attention</text>
<path d="M -70.0 -18.0 H 40.0 V -44.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 40.0 -90.0 V -116.0 H -57.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="-5.0" y="-125.0" text-anchor="middle" font-size="12" fill="#55606b" opacity="0.9">dropout</text>
<circle cx="-70.0" cy="-116.0" r="10" fill="none" stroke="#55606b" stroke-width="1.5"/>
<path d="M -75.0 -116.0 h 10 M -70.0 -121.0 v 10" stroke="#55606b" stroke-width="1.5"/>
<line x1="-70.0" y1="0.0" x2="-70.0" y2="-144.0" stroke="#55606b" stroke-width="3"/>
<rect x="-130.0" y="-174.0" width="120.0" height="30.0" rx="6" fill="#EFF1F3" stroke="#55606b" stroke-width="1.5"/>
<text x="-70.0" y="-154.0" text-anchor="middle" font-size="12" fill="#1a2a3a">LayerNorm</text>
<rect x="-35.0" y="-248.0" width="150.0" height="30.0" rx="6" fill="#EAF3EE" stroke="#2F7A4F" stroke-width="1.5"/>
<text x="40.0" y="-228.0" text-anchor="middle" font-size="14" fill="#1a2a3a">Feed Forward</text>
<path d="M -70.0 -192.0 H 40.0 V -218.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 40.0 -248.0 V -274.0 H -57.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="-5.0" y="-283.0" text-anchor="middle" font-size="12" fill="#55606b" opacity="0.9">dropout</text>
<circle cx="-70.0" cy="-274.0" r="10" fill="none" stroke="#55606b" stroke-width="1.5"/>
<path d="M -75.0 -274.0 h 10 M -70.0 -279.0 v 10" stroke="#55606b" stroke-width="1.5"/>
<line x1="-70.0" y1="-174.0" x2="-70.0" y2="-302.0" stroke="#55606b" stroke-width="3"/>
<rect x="-130.0" y="-332.0" width="120.0" height="30.0" rx="6" fill="#EFF1F3" stroke="#55606b" stroke-width="1.5"/>
<text x="-70.0" y="-312.0" text-anchor="middle" font-size="12" fill="#1a2a3a">LayerNorm</text>
<line x1="-70.0" y1="-332.0" x2="-70.0" y2="-362.0" stroke="#55606b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="-70.0" y="-376.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.85">to the next block</text>
<text x="-86.0" y="-64.0" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7" transform="rotate(-90 -86.0 -64.0)">residual path</text>
<text x="266.0" y="34.0" text-anchor="start" font-size="12" fill="currentColor" opacity="0.85">x — from the previous block</text>
<rect x="301.0" y="-74.0" width="150.0" height="30.0" rx="6" fill="#EFF1F3" stroke="#55606b" stroke-width="1.5"/>
<text x="376.0" y="-54.0" text-anchor="middle" font-size="12" fill="#1a2a3a">LayerNorm</text>
<path d="M 266.0 -18.0 H 376.0 V -44.0" fill="none" stroke="#55606b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="301.0" y="-134.0" width="150.0" height="46.0" rx="6" fill="#ECF3FA" stroke="#1F5CA8" stroke-width="1.5"/>
