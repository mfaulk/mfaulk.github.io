<svg xmlns="http://www.w3.org/2000/svg" viewBox="-124.7 -374.0 935.4 448.0" width="935.4" height="448.0" font-family="system-ui, -apple-system, Segoe UI, Helvetica, sans-serif" role="img" aria-label="Three transformer architectures side by side. The Transformer has an encoder stack of self-attention and feed-forward sublayers and a decoder stack of masked self-attention, cross-attention and feed-forward sublayers. GPT is decoder-only: a single stack of masked self-attention and feed-forward sublayers producing next-token probabilities. BERT is encoder-only: a single stack of unmasked self-attention and feed-forward sublayers producing masked-token probabilities.">
