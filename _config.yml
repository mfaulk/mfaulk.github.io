title: "Matt Faulkner's Blog"
author: "Matt Faulkner"
description: "Thoughts from an Engineer, Entrepreneur, Applied Cryptographer" # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

# Email / Social media usernames used by the minima theme:
# All of these are optional and can be removed or commented out
#email: "example@mail.com"
#twitter_username: "twitteruser"
github_username: "mfaulk"
linkedin_username: "matthew-faulkner-64525956"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username;

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

markdown: kramdown

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      tags: Other

# The github-pages gem bundles jekyll-readme-index, which turns any README.md
# into its directory's index page, and jekyll-optional-front-matter, which makes
# every other .md a page. Without this, the repo's own docs (tools/*/README.md,
# experiment outputs under out/) are published as blog pages and listed in the
# site navigation. Keep Jekyll's defaults — setting exclude replaces them.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - tools/
  - out/

# Pin the nav explicitly so a stray markdown file can never add a link to it.
header_pages:
  - archive.md
